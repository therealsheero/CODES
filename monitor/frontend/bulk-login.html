<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UIDAI Bulk Data Export — Login</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./assets/favicon.svg">
</head>

<body>

    <header class="gov-header">
        <div class="gov-left">
            <img src="./assets/india-emblem.png" alt="India Emblem">
        </div>

        <div class="gov-center">
            <h1>UIDAI — Token Management System</h1>
            <p>Unique Identification Authority of India</p>
        </div>

        <div class="gov-right">
            <img src="./assets/Aadhaar_Small.png" alt="Aadhaar Logo">
        </div>
    </header>

    <div class="login-container">

        <h2>🔒 Bulk Data Export Login</h2>

        <form id="loginForm">

            <input
                type="text"
                id="loginUsername"
                placeholder="Username"
                required
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
                required
            >

            <button type="submit" id="loginBtn">
                Login
            </button>

            <div id="loginError">
                Invalid credentials
            </div>

        </form>

    </div>

    <script src="./js/bulk-login.js"></script>

</body>
</html>
