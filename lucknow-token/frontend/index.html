<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="refresh" content="1;url=https://sewa.uidai.gov.in/">

    <title>Service Moved</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .box {
            width: 90%;
            max-width: 520px;
            padding: 40px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #222;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 28px;
            background: #0066cc;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }

        .button:hover {
            background: #0052a3;
        }

        .note {
            margin-top: 20px;
            font-size: 14px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Service Moved</h1>

        <p>
            The Token Generation service has moved to the new UIDAI portal.
        </p>

        <p>
            Please click the button below to continue.
        </p>

        <a
            class="button"
            href="https://sewa.uidai.gov.in/"
        >
            Continue to UIDAI Portal
        </a>

        <p class="note">
            You will be redirected automatically in 1 second.
        </p>
    </div>

</body>
</html>
