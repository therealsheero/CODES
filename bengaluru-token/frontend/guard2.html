<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title data-i18n="guard.title">
    Guard Token Dashboard
  </title>

  <link rel="icon" href="./assets/favicon.svg?v=2">

  <script src="./js/i18n.js?v=3"></script>

  <style>



    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;

      background-image: url("./assets/bg3.png?v=3");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }



    .gov-header {
      width: 100%;
      box-sizing: border-box;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 10px 20px;

      background: linear-gradient(90deg, #fada5e, #eedc82);

      color: black;

      border-bottom: 4px solid #f59e0b;
    }


    .gov-left {
      width: 180px;

      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .gov-left img {
      height: 60px;
      width: auto;
      object-fit: contain;
    }



    .gov-center {
      flex: 1;
      text-align: center;
    }

    .gov-center h1 {
      margin: 0;

      font-size: 22px;
      font-weight: 700;

      color: black;
    }


    .gov-right {
      width: 180px;

      display: flex;
      align-items: center;
      justify-content: flex-end;
    }



    .gov-lang-container {
      width: auto !important;

      display: flex;
      align-items: center;
      justify-content: flex-end;

      margin: 0 !important;
    }

    .gov-lang-select,
    #langSelect {
      width: auto !important;

      min-width: 170px;
      max-width: 210px;

      margin: 0 !important;

      padding: 7px 10px;

      font-size: 14px;

      background: white;
      color: #111;

      border: 1px solid #999;
      border-radius: 5px;

      cursor: pointer;
    }


    h2 {
      text-align: center;

      margin: 28px 0 15px;

      font-size: 26px;
    }


    .actions {
      margin: 15px 0 22px;

      text-align: center;
    }

    .actions button {
      display: inline-block;

      width: auto !important;

      padding: 9px 18px;

      margin: 5px;

      border: 1px solid #aaa;

      border-radius: 4px;

      background: #f5f5f5;

      color: #111;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .actions button:hover {
      background: #e5e5e5;
    }


    #tokenTable {
      width: calc(100% - 40px);

      margin: 0 auto 30px;

      border-collapse: collapse;

      background: white;
    }

    #tokenTable th,
    #tokenTable td {
      border: 1px solid #ccc;

      padding: 8px;

      font-size: 13px;

      text-align: center;
      vertical-align: middle;
    }

    #tokenTable th {
      background: #f2f2f2;

      font-weight: 700;

      white-space: nowrap;
    }


    #tokenTable tr.ap,
    #tokenTable tr.wp {
      background-color: #ffe6e6;

      font-weight: bold;
    }

    #tokenTable tr.an {
      background-color: #fff9c4;
    }

    #tokenTable tr.wl {
      background-color: #e6fffa;
    }

    #tokenTable tr.wn {
      background-color: #ffffff;
    }


    @media (max-width: 700px) {

      .gov-header {
        padding: 8px 10px;
      }

      .gov-left {
        width: 60px;
      }

      .gov-left img {
        height: 45px;
      }

      .gov-center h1 {
        font-size: 18px;
      }

      .gov-right {
        width: auto;
      }

      .gov-lang-select,
      #langSelect {
        min-width: 110px;
        max-width: 130px;

        padding: 6px;

        font-size: 12px;
      }

      h2 {
        font-size: 21px;
      }

      #tokenTable {
        width: 100%;
      }

    }
    #physicalReferenceSection {
  margin-top: 40px;
  margin-bottom: 40px;
}

#physicalReferenceTable {
  width: calc(100% - 40px);
  margin: 0 auto 30px;
  border-collapse: collapse;
  background: white;
}

#physicalReferenceTable th,
#physicalReferenceTable td {
  border: 1px solid #ccc;
  padding: 8px;
  font-size: 13px;
  text-align: center;
  vertical-align: middle;
}

#physicalReferenceTable th {
  background: #f2f2f2;
  font-weight: 700;
  white-space: nowrap;
}


    @media (max-width: 500px) {

      .gov-header {
        flex-wrap: wrap;

        gap: 8px;
      }

      .gov-left {
        width: 50px;
      }

      .gov-center {
        flex: 1;
      }

      .gov-right {
        width: 100%;

        justify-content: center;
      }

      .gov-lang-container {
        justify-content: center;
      }

      .gov-lang-select,
      #langSelect {
        width: 180px !important;

        max-width: 180px;
      }

    }

  </style>

</head>


<body>


<header class="gov-header">

  <div class="gov-left">

    <img
      src="./assets/india-emblem.png"
      alt="Government of India Logo"
    >

  </div>


  <div class="gov-center">

    <h1 data-i18n="header.title">
      Government of India
    </h1>

  </div>


  <div class="gov-right">
  </div>

</header>


<h2 data-i18n="guard.title">
  Guard Token Dashboard (Today Only)
</h2>


<div class="actions">

  <button
    onclick="loadTokens()"
    data-i18n="guard.refresh"
  >
    Refresh
  </button>


  <button
    onclick="logout()"
    data-i18n="guard.logout"
  >
    Logout
  </button>

</div>


<table id="tokenTable">

  <thead>

    <tr>
    </tr>

  </thead>

  <tbody>
  </tbody>

</table>
<section id="physicalReferenceSection">

  <h2>
    Physical / Reference Entries Today
  </h2>

  <table id="physicalReferenceTable">

    <thead>
      <tr>
        <th>Token</th>
        <th>Name</th>
        <th>Age</th>
        <th>Mobile</th>
        <th>Gender</th>
        <th>State</th>
        <th>District</th>
        <th>EID</th>
        <th>Service</th>
        <th>Token Type</th>
        <th>Created At</th>
        <th>Reference Of</th>
      </tr>
    </thead>

    <tbody>
    </tbody>

  </table>

</section>


<script src="./js/guard2.js?v=12"></script>

</body>

</html>
